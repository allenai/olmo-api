apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: eval-full
  labels:
    tier: full
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      parallelism: 2
      taskCount: 2
      template:
        spec:
          containers:
            - image: gcr.io/my-project/evaluations:latest
              resources:
                limits:
                  cpu: "4"
                  memory: 8Gi
              env:
                - name: EVAL_TIER
                  value: full
                # Secrets from Secret Manager
                - name: LITELLM_PROXY_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: litellm-proxy-api-key
                      key: latest
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: pg-host
                      key: latest
                - name: PGPORT
                  valueFrom:
                    secretKeyRef:
                      name: pg-port
                      key: latest
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: pg-user
                      key: latest
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: pg-password
                      key: latest
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aws-access-key-id
                      key: latest
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aws-secret-access-key
                      key: latest
          timeoutSeconds: 21600
