apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: eval-full
  labels:
    tier: full
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      parallelism: 2
      taskCount: 2
      template:
        spec:
          containers:
            - image: us-west1-docker.pkg.dev/my-project/model-evals/evaluations:latest
              resources:
                limits:
                  cpu: "4"
                  memory: 8Gi
              env:
                - name: EVAL_TIER
                  value: full
                - name: LOCAL
                  value: "true"
                # Secrets from Secret Manager
                - name: LITELLM_PROXY_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: litellm-proxy-api-key
                      key: latest
                # Storage secrets (uncomment when storage is configured)
                # - name: PGHOST
                #   valueFrom:
                #     secretKeyRef:
                #       name: pg-host
                #       key: latest
                # - name: PGPASSWORD
                #   valueFrom:
                #     secretKeyRef:
                #       name: pg-password
                #       key: latest
                # - name: AWS_ACCESS_KEY_ID
                #   valueFrom:
                #     secretKeyRef:
                #       name: aws-access-key-id
                #       key: latest
                # - name: AWS_SECRET_ACCESS_KEY
                #   valueFrom:
                #     secretKeyRef:
                #       name: aws-secret-access-key
                #       key: latest
          timeoutSeconds: 21600
