[project]
name = "evaluations"
version = "0.1.0"
description = "OLMo evaluation runner for Cloud Run Jobs"
requires-python = ">=3.12"

dependencies = [
    "olmo-eval-internal[litellm,storage] @ git+https://github.com/allenai/olmo-eval-internal.git@main",
    "click>=8.0",
]

[project.scripts]
evaluations = "evaluations.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/evaluations"]
