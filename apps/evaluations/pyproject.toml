[project]
name = "evaluations"
version = "0.1.0"
description = "OLMo evaluation runner for Cloud Run Jobs"
requires-python = ">=3.12"

dependencies = [
    "olmo-eval-internal[litellm,storage]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluations"]

[tool.uv.sources]
olmo-eval-internal = { path = "olmo-eval-internal" }
