[project]
name = "evaluations"
version = "0.1.0"
description = "OLMo evaluation runner for Cloud Run Jobs"
requires-python = ">=3.12"

dependencies = [
    "pydantic-settings>=2.0",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "boto3-stubs[secretsmanager]>=1.35",
    "botocore-stubs>=1.35",
]

[project.scripts]
evaluations = "evaluations.cli:main"
generate-tfvars = "evaluations.generate_tfvars:main"
run-local = "evaluations.run_local:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

