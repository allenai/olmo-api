name: Set up repo
description: Install uv, just, and packages

runs:
  using: "composite"
  steps:
  - name: Set up Python
    uses: actions/setup-python@v6
    with:
      python-version: "3.14"

  - name: Install uv
    uses: astral-sh/setup-uv@v7
    with:
      enable-cache: true

  - name: Install dependencies
    run: uv sync --locked --all-extras --all-packages --all-groups
    shell: bash

  - name: Install Just
    uses: taiki-e/install-action@just