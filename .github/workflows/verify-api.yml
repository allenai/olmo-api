name: Verify

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
    unit-test:
      runs-on: ubuntu-latest
      env:
        AUTH_DOMAIN: ${{ vars.AUTH_DOMAIN }}
        AUTH_AUDIENCE: ${{ vars.AUTH_AUDIENCE }}
        ENV: test
      steps:
        - uses: actions/checkout@v6

        - name: Set up uv
          uses: ./.github/actions/set-up-uv

        - name: Test with pytest
          run: uv run pytest --ignore ./apps/api/e2e  --ignore ./apps/evaluations

    type-check:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6

        - name: Set up uv
          uses: ./.github/actions/set-up-uv

        - run: uv run mypy apps/api packages

    lint:
      runs-on: ubuntu-latest  
      steps:
      - uses: actions/checkout@v6
  
      - name: Set up uv
        uses: ./.github/actions/set-up-uv

      - run: uv run ruff check --output-format=github
      
    format:
      runs-on: ubuntu-latest 
      steps:
        - uses: actions/checkout@v6
    
        - name: Set up uv
          uses: ./.github/actions/set-up-uv

        - run: uv run ruff format --check
