name: Build and Deploy Evaluations Cloud Run Jobs

on:
  push:
    branches:
      - main
    paths:
      - 'apps/evaluations/**'
      - '.github/workflows/build-and-push-evals.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: us-west1
  SERVICE_NAME: evaluations
  REGISTRY: us-west1-docker.pkg.dev
  REPO: model-evals

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
    steps:
      - name: Skiff2 Setup
        id: setup
        uses: allenai/skiff-commodore/shared-actions/setup/@main
        with:
          workload_identity_provider: ${{ vars.SKIFF2_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SKIFF2_SERVICE_ACCOUNT }}
          project_id: ${{ vars.SKIFF2_PROJECT_ID }}

      # Configure Docker for Artifact Registry
      - name: Configure Docker
        run: gcloud auth configure-docker ${REGISTRY} --quiet

      # Custom build step for evaluations (handles GITHUB_TOKEN for private repo)
      # Once olmo-eval-internal is public, this can be replaced with Skiff2 Build
      - name: Build and Push Evaluations Image
        id: build
        env:
          PROJECT_ID: ${{ vars.SKIFF2_PROJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.OLMO_EVAL_INTERNAL_TOKEN }}
        run: |
          IMAGE_TAG="${REGISTRY}/${PROJECT_ID}/${REPO}/${SERVICE_NAME}"

          docker buildx build \
            --platform linux/amd64 \
            --push \
            --cache-from "type=registry,ref=${IMAGE_TAG}:latest" \
            --cache-to "type=inline" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg "GITHUB_TOKEN=${GITHUB_TOKEN}" \
            --tag "${IMAGE_TAG}:latest" \
            --tag "${IMAGE_TAG}:${{ github.sha }}" \
            --file apps/evaluations/Dockerfile \
            apps/evaluations

          echo "image=${IMAGE_TAG}:${{ github.sha }}" >> $GITHUB_OUTPUT

      # Deploy Cloud Run Jobs
      - name: Deploy Cloud Run Jobs
        env:
          PROJECT_ID: ${{ vars.SKIFF2_PROJECT_ID }}
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          # Update job YAMLs with actual image tag and deploy
          for tier in smoke standard full; do
            YAML_FILE="apps/evaluations/cloud-run-jobs/${tier}.yaml"
            if [ -f "$YAML_FILE" ]; then
              echo "Deploying eval-${tier}..."
              # Replace placeholder project and image with actual values
              sed -i "s|my-project|${PROJECT_ID}|g" "$YAML_FILE"
              sed -i "s|${REGISTRY}/${PROJECT_ID}/${REPO}/${SERVICE_NAME}:latest|${IMAGE}|g" "$YAML_FILE"
              gcloud run jobs replace "$YAML_FILE" --region "$REGION" --project "$PROJECT_ID"
            fi
          done
